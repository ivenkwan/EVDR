# Edge exposure for the DAST target. Middlewares are defined in-namespace
# (Traefik runs with allowCrossNamespace: false — see src/infra/traefik).
---
# In-namespace copy of traefik/edge-security-headers (allowCrossNamespace:
# false). Must mirror the edge policy field-for-field — the first version of
# this copy dropped stsSeconds and the ZAP baseline caught the missing HSTS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hello-security-headers
  namespace: evdr-system
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    stsSeconds: 15552000
    stsIncludeSubdomains: true
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hello-rate-limit
  namespace: evdr-system
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-service
  namespace: evdr-system
spec:
  entryPoints:
    - websecure
  routes:
    # PathPrefix(`/`): every path on this host reaches the service, so even
    # 404s (Go mux NotFound) pass through the header middlewares — scanner
    # probes like /robots.txt then carry the same security headers as real
    # endpoints instead of Traefik's bare default 404.
    - match: Host(`hello.staging.evdr.internal`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: hello-security-headers
        - name: hello-rate-limit
      services:
        - name: hello-service
          port: 80
  tls:
    secretName: hello-staging-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-staging-tls
  namespace: evdr-system
spec:
  secretName: hello-staging-tls
  commonName: hello.staging.evdr.internal
  dnsNames:
    - hello.staging.evdr.internal
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-pki-issuer
    kind: ClusterIssuer
