# Staging deployment for the pipeline-validation service (DAST target).
# Applied by the deploy:sample-staging CI job; the image reference is
# overwritten by `kubectl set image` with the exact scanned build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: hello-service
    app.kubernetes.io/part-of: evdr
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-service
          # Placeholder only — CI replaces this with the scanned image:tag.
          image: registry.invalid/evdr/hello-service:0.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
