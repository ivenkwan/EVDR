# K3s server configuration — EVDR hardened baseline.
# Installed to /etc/rancher/k3s/config.yaml by scripts/install-server.sh.

write-kubeconfig-mode: "0600"
secrets-encryption: true
protect-kernel-defaults: true

# We run our own ingress and storage stacks — see README.md.
disable:
  - traefik
  - local-storage

# SR-1.2: TLS 1.2/1.3 only, strong suites. TLS 1.3 suites are fixed by the
# Go runtime; this list constrains TLS 1.2.
tls-cipher-suites:
  - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
  - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
  - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
  - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
  - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256

kube-apiserver-arg:
  - "enable-admission-plugins=NodeRestriction"
  - "audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log"
  - "audit-log-maxage=30"
  - "audit-log-maxbackup=10"
  - "audit-log-maxsize=100"

kubelet-arg:
  - "serialize-image-pulls=false"

# Cluster state snapshots (precedes the full backup storey, NFR-3.4).
etcd-snapshot-schedule-cron: "0 */6 * * *"
etcd-snapshot-retention: 28
