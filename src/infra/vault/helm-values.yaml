# Vault Helm values — EVDR HA baseline (TR-1.4).
# Chart: hashicorp/vault (pin the chart version at install time; see runbook).
#
# Deploy:
#   helm upgrade --install vault hashicorp/vault \
#     --namespace vault --create-namespace \
#     -f src/infra/vault/helm-values.yaml

global:
  enabled: true
  tlsDisable: false # SR-1.2 — TLS everywhere, including in-cluster

injector:
  # Sidecar injector is used by application services from Phase 1 onward.
  enabled: true
  metrics:
    enabled: false

server:
  # Serving certificate issued by cert-manager (bootstrap CA until Vault PKI
  # is live — see README.md "Bootstrap order").
  extraVolumes:
    - type: secret
      name: vault-tls # cert-manager Certificate in the vault namespace
  extraEnvironmentVars:
    VAULT_ADDR: "https://vault.vault.svc:8200"
    # In-pod CLI + raft peer verification need the issuing CA. With a
    # user-supplied TLS secret the chart cannot auto-inject it, and the
    # vault-tls secret already carries ca.crt (cert-manager) at this path.
    # Without this, `vault operator raft join` fails with x509 unknown
    # authority between peers.
    VAULT_CACERT: "/vault/userconfig/vault-tls/ca.crt"

  dataStorage:
    enabled: true
    size: 10Gi
  auditStorage:
    enabled: true # file audit device target; enabled in bootstrap before secrets
    size: 5Gi

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      # Chart 0.29.x: when ha.raft.enabled=true the config ConfigMap renders
      # ha.raft.config and IGNORES ha.config (templates/_helpers.tpl,
      # "vault.config"). The listener/storage config must live here.
      config: |
        ui = false

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
          tls_min_version = "tls12"
        }

        storage "raft" {
          path = "/vault/data"

          # The chart's default retry_join template renders leader_ca_cert_file
          # ONLY when it provisions TLS itself (server.tls.secret is empty). We
          # supply the serving cert via cert-manager (vault-tls), so the raft
          # join client otherwise has no CA and peer verification fails with
          # x509 unknown authority. VAULT_CACERT covers the CLI, NOT the raft
          # join transport — the CA must be named in the stanza.
          retry_join {
            leader_api_addr       = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file   = "/vault/userconfig/vault-tls/ca.crt"
            leader_tls_servername = "vault-0.vault-internal"
          }
          retry_join {
            leader_api_addr       = "https://vault-1.vault-internal:8200"
            leader_ca_cert_file   = "/vault/userconfig/vault-tls/ca.crt"
            leader_tls_servername = "vault-1.vault-internal"
          }
          retry_join {
            leader_api_addr       = "https://vault-2.vault-internal:8200"
            leader_ca_cert_file   = "/vault/userconfig/vault-tls/ca.crt"
            leader_tls_servername = "vault-2.vault-internal"
          }
        }

        service_registration "kubernetes" {}

        # Log level kept at info; audit device carries the security trail.
        log_level = "info"

      # Raft snapshots are taken by scheduled job (runbook) ahead of the full
      # backup storey (NFR-3.4).

  # Anti-affinity keeps Vault nodes on separate K3s nodes.
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: vault
          topologyKey: kubernetes.io/hostname

ui:
  enabled: false # Vault UI off; CLI/API only — one less attack surface
