# Cluster default TLS policy (SR-1.2): TLS 1.2 floor, strong suites, strict SNI.
# Bound to the websecure entrypoint via helm-values.yaml (tls.options: default).
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS12
  sniStrict: true
  cipherSuites:
    # TLS 1.2 suites only; TLS 1.3 suites are fixed by the Go runtime.
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  alpnProtocols:
    - h2
    - http/1.1
