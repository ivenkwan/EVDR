# Bootstrap internal CA — exists only to issue Vault's serving certificate
# before Vault PKI is live. Apply order: cert-manager chart → this file.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-bootstrap-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: EVDR Bootstrap CA
  secretName: internal-bootstrap-ca
  duration: 2160h # 90d — short-lived by design; replaced by Vault PKI as the steady-state issuer
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-bootstrap-ca
spec:
  ca:
    secretName: internal-bootstrap-ca
