# PostgreSQL 16 credentials — PLACEHOLDER (Phase 0 Vault pattern, TR-2.11)
#
# Real values are Vault-managed at kv-v2 path:
#   secret/evdr/services/postgresql        (keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB)
# readable by the evdr-service-template policy (src/infra/vault/policies/evdr-service-template.hcl).
#
# Operator step (Phase 1 runbook): vault kv get → kubectl create secret (or sync tooling).
# NEVER commit real credentials. The values below are inert placeholders that will make
# initdb succeed only if an operator replaces them before/at first apply.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: evdr
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # CHANGE_ME — Vault: secret/evdr/services/postgresql
  POSTGRES_USER: "evdr_app"
  POSTGRES_PASSWORD: "CHANGE_ME_postgres_password"
  POSTGRES_DB: "evdr"
