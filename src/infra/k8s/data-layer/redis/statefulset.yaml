# Redis 7 StatefulSet (TR-2.12) — evdr-system.
#
# Image digest-pinned (redis:7.4.11, multi-arch manifest):
#   sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
# Auth: ACL file from the redis Secret (Vault-managed values, see secret.yaml).
# PSS: restricted (evdr-system enforces restricted; this pod complies).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: evdr
    app.kubernetes.io/component: cache
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: evdr
        app.kubernetes.io/component: cache
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999            # image's redis user
        fsGroup: 999              # AOF volume group ownership
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
            - --aclfile
            - /etc/redis/users.acl
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # TCP probes: redis-cli ping would answer NOAUTH under ACL auth and wedge
          # readiness — port-open is the honest signal (see README).
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: acl
              mountPath: /etc/redis/users.acl
              subPath: users.acl
              readOnly: true
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true # logs to stdout; only /data is written
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: redis
        - name: acl
          secret:
            secretName: redis
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block # Rook RBD (see ../rook/); lab: override to local-path
        resources:
          requests:
            storage: 1Gi
