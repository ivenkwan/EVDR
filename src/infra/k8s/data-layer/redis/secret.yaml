# Redis ACL file — PLACEHOLDER (Phase 0 Vault pattern, TR-2.12)
#
# Real value is Vault-managed at kv-v2 path:
#   secret/evdr/services/redis        (key: REDIS_PASSWORD)
# readable by the evdr-service-template policy (src/infra/vault/policies/evdr-service-template.hcl).
#
# Operator step: replace CHANGE_ME_redis_password from Vault, then kubectl apply (or sync tooling).
# NEVER commit real credentials.
#
# Mounted at /etc/redis/users.acl and passed to redis-server --aclfile. The `>password`
# token defines the default user's password; `~*` all keys, `&*` all channels, `+@all`
# all command categories (command scoping is a follow-up hardening, see README).
apiVersion: v1
kind: Secret
metadata:
  name: redis
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: evdr
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  users.acl: "user default on >CHANGE_ME_redis_password ~* &* +@all"
