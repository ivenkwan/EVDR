# Starter realm bootstrap for Keycloak (TR-6.1 prep / FR-4.1 / FR-4.2).
#
# Mounted at /opt/keycloak/data/import/evdr-realm.json — Keycloak imports any
# *.json found there on startup (first boot). The realm JSON below was built
# from a real Keycloak 26.5 realm export (default clients, client scopes,
# authentication flows preserved) and hardened for EVDR:
#   - realm "evdr": Tier 0 single realm; template for realm-per-tenant
#     provisioning (Phase 2.5 Tenant Provisioner, TR-6.5).
#   - OIDC enabled (default) + 'nextcloud' client pre-created for TR-6.2.
#   - SAML 2.0 enabled: 'evdr-saml-sp-placeholder' SP client (disabled) +
#     'enterprise-saml-idp' SAML IdP placeholder (disabled).
#   - 2FA (FR-4.2): TOTP (HMAC-SHA256/6/30s) + WebAuthn policies; browser
#     flow enables passkey (webauthn-authenticator ALTERNATIVE); CONFIGURE_TOTP
#     and webauthn-register are DEFAULT required actions (enrollment enforced
#     before first login completes).
#   - No users and no real credentials in this file — users come from
#     AD/LDAP federation (FR-4.1, post-import step, see README §7) or are
#     provisioned by the control plane.
#
# Client secrets inside are PLACEHOLDERS (CHANGE-ME-...) — rotate from Vault
# before enabling any client that must authenticate (see README §6).
apiVersion: v1
kind: ConfigMap
metadata:
  name: evdr-realm-bootstrap
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: evdr
