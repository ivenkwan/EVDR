# EXAMPLE ONLY — NOT applied by default.
#
# Expected shape of the `keycloak-secrets` Secret (namespace evdr-system)
# referenced by keycloak-deployment.yaml. All values here are inert
# placeholders; create the real Secret from Vault (README §6):
#
#   vault kv put secret/evdr/services/keycloak/admin \
#     KC_BOOTSTRAP_ADMIN_USERNAME=... KC_BOOTSTRAP_ADMIN_PASSWORD=-
#   vault kv put secret/evdr/services/keycloak/db \
#     KC_DB_USERNAME=keycloak KC_DB_PASSWORD=-
#
# At scale, prefer the Vault Agent sidecar injector (annotations in the
# Deployment) over a static Secret; dynamic DB credentials land at
# database/creds/keycloak once the Vault database engine is wired to
# PostgreSQL (Phase 1 data layer).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: evdr
type: Opaque
stringData:
  # Keycloak master-realm bootstrap admin (TR-6.1). Rotate/change after first
  # login; never leave the bootstrap admin as a standing credential.
  KC_BOOTSTRAP_ADMIN_USERNAME: "CHANGE-ME-keycloak-admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE-ME-strong-random-32+chars"
  # PostgreSQL 16 (shared data layer, workstream B). The DB user needs CREATE
  # on database `keycloak` for the first-boot schema bootstrap.
  KC_DB_USERNAME: "keycloak"
  KC_DB_PASSWORD: "CHANGE-ME-strong-random-32+chars"
