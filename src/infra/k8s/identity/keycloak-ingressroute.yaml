# Traefik IngressRoute — external SSO entry for Keycloak.
#
# Edge posture (src/infra/traefik/): TLS terminated here (websecure entrypoint),
# unconditional HTTP->HTTPS redirect at the web entrypoint, default TLS option
# (TLS 1.2 floor, strict SNI) bound cluster-wide, Vault-PKI default certificate
# as TLSStore fallback. Per-route SNI keycloak.evdr.internal matches the
# cert-manager-issued keycloak-tls certificate (referenced via tls.secretName).
#
# Middlewares: cluster baseline from src/infra/traefik/crds/middlewares.yaml,
# referenced cross-namespace (namespace/name form).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: evdr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keycloak.evdr.internal`)
      middlewares:
        - name: edge-security-headers
          namespace: traefik
        - name: edge-rate-limit
          namespace: traefik
      services:
        - name: keycloak
          port: 8080
  tls:
    secretName: keycloak-tls
