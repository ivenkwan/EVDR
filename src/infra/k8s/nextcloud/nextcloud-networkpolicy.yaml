# Nextcloud NetworkPolicy — network separation from external-facing services
# (TR-2.13). Additive on top of src/infra/network/network-policies.yaml
# (evdr-system: default-deny-all + allow-evdr-system-baseline).
#
# Effective allow-set for nextcloud pods:
#   Ingress: SAME-NAMESPACE pods only on :80 (the pod listens on 80; the
#            nextcloud Service maps 8080→80). No edge namespace, no other
#            namespaces.
#   Egress:  Traefik edge namespace :443 ONLY as the delta here. PostgreSQL
#            (:5432) + Redis (:6379) + Keycloak live in evdr-system and are
#            covered by the baseline's unrestricted intra-namespace egress
#            (podSelector {} rule — see src/infra/network/network-policies.yaml).
#            The edge egress exists for OIDC (user_oidc discovery +
#            authorization redirects at https://keycloak.evdr.internal/realms/evdr,
#            TR-6.2 — wave-3 lab-verified: provider registration fetches the
#            well-known document through the edge).
#
# Wave 3 lab reconciliation: the Wave-1 draft declared egress to a `storage`
# namespace and ingress on :8080 — both stale (data layer landed in
# evdr-system per the data-layer README; pods listen on :80).
#
# KNOWN GAP (documented, see README §7): the namespace baseline
# allow-evdr-system-baseline grants the traefik namespace ingress to EVERY
# pod in evdr-system, and NetworkPolicies are additive — so traefik can still
# reach Nextcloud at L3/L4 today. Real separation comes from the absence of
# any Nextcloud edge route (no IngressRoute exists) plus this policy. Closing
# the L3/L4 gap requires narrowing the evdr-system baseline (podSelector on
# allow-evdr-system-baseline) — owned by src/infra/network/, tracked as a
# follow-up for the orchestrator/apply wave.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: evdr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Room SPI / platform services in the same namespace only.
        - podSelector: {}
      ports:
        - port: 80
          protocol: TCP
  egress:
    - to:
        # OIDC discovery + redirects via the Traefik edge (TR-6.2).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 443
          protocol: TCP
