# Nextcloud Service — INTERNAL ONLY (TR-2.13 network separation).
#
# No IngressRoute exists for Nextcloud in this workstream: external traffic
# never reaches Nextcloud directly — the Room SPI (src/spi) and its adapters
# are the only documented consumers (AGENTS.md hard rule: never bypass the
# Room SPI). Direct edge exposure requires an explicit review (see README §7).
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: evdr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nextcloud
  ports:
    - name: http
      port: 8080
      targetPort: 80
      protocol: TCP
