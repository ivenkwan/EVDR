# EXAMPLE ONLY — NOT applied by default.
#
# Expected shape of the `nextcloud-secrets` Secret (namespace evdr-system)
# referenced by nextcloud-deployment.yaml. All values here are inert
# placeholders; create the real Secret from Vault (README §6):
#
#   vault kv put secret/evdr/services/nextcloud/db \
#     POSTGRES_USER=nextcloud POSTGRES_PASSWORD=-
#   vault kv put secret/evdr/services/nextcloud/admin \
#     NEXTCLOUD_ADMIN_USER=... NEXTCLOUD_ADMIN_PASSWORD=-
#   vault kv put secret/evdr/services/nextcloud/oidc \
#     OIDC_CLIENT_SECRET=-
#   vault kv put secret/evdr/services/nextcloud/redis REDIS_HOST_PASSWORD=-
#
# At scale, prefer the Vault Agent sidecar injector (annotations in the
# Deployment); dynamic DB credentials land at database/creds/nextcloud once
# the Vault database engine is wired to PostgreSQL (Phase 1 data layer).
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secrets
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: evdr
type: Opaque
stringData:
  # PostgreSQL 16 (shared data layer, workstream B).
  POSTGRES_USER: "nextcloud"
  POSTGRES_PASSWORD: "CHANGE-ME-strong-random-32+chars"
  # Redis 7 (file locking / distributed cache, TR-2.12/2.13). Optional on the
  # Tier 0 lab if Redis runs ACL-less; REQUIRED once Redis ACLs are enabled.
  REDIS_HOST_PASSWORD: "CHANGE-ME-redis-acl-password"
  # First-install Nextcloud admin (created only when no config exists yet).
  # Replace with provisioned identities / SSO once OIDC is live (TR-6.2).
  NEXTCLOUD_ADMIN_USER: "CHANGE-ME-nextcloud-admin"
  NEXTCLOUD_ADMIN_PASSWORD: "CHANGE-ME-strong-random-32+chars"
  # OIDC client secret — MUST match the Keycloak realm's `nextcloud` client
  # secret (identity/keycloak-realm-bootstrap.yaml placeholder; rotate there
  # first, then here). Consumed by the occ user_oidc step (README §5).
  OIDC_CLIENT_SECRET: "CHANGE-ME-vault-secret-evdr/services/nextcloud/oidc"
