# Persistent storage for Nextcloud (TR-2.13).
#
# storageClassName: ceph-block is the data-layer StorageClass (workstream B,
# src/infra/k8s/data-layer/rook/storageclass-ceph-block.yaml). Reconcile
# note: earlier drafts used "rook-ceph-block"; corrected at Wave 3 lab apply.
# k3d-lab variant (no block devices): nextcloud-pvc.lab.yaml → local-path.
#
# Volumes:
#   nextcloud-html  — application + config (/var/www/html): persists occ
#                     app installs/upgrades and config.php.
#   nextcloud-data  — user file data (/var/www/data): the document corpus.
#                     Backed up per the strategy in README §6; object-storage
#                     offload (Ceph RGW primary store, AGENTS.md stack) is a
#                     follow-up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: evdr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: evdr-system
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: evdr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
